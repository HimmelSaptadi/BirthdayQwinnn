<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>🎂 For You</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
  overflow: hidden;
}

.container {
  text-align: center;
  max-width: 600px;
  padding: 30px;
  animation: fadeIn 1.5s ease;
}

button {
  margin-top: 30px;
  padding: 12px 28px;
  border: none;
  border-radius: 30px;
  background: #ff7eb3;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #ff4f9a;
  transform: scale(1.05);
}

.hidden {
  display: none;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">
  <div id="text"></div>
  <button id="actionBtn">Klik ini</button>
</div>

<audio id="music" src="pasillyo.mp3" loop></audio>

<script>
const textEl = document.getElementById("text");
const btn = document.getElementById("actionBtn");
const music = document.getElementById("music");

music.volume = 0.25;

let step = 0;

const messages = [
  "Eh… tunggu dulu.<br><br>Ada sesuatu buat kamu.<br><br>Siap nggak?",
  
  "Happy Birthday 🎉✨<br><br>Hari ini spesial, karena yang ultah juga spesial.<br><br>Semoga kamu selalu sehat, bahagia, dan tetap jadi kamu yang sekarang.<br><br>Oh iya… wilujeng tepang taun ya 😄",

  "Serius diulang lagi? 😌<br><br>Berarti kamu penasaran ya.<br><br>Just so you know,<br>you make days feel lighter without even trying.<br><br>Hehe.",

  "Fix kamu emang nggak bisa berhenti 😆<br><br>Tapi gapapa.<br><br>Kalau ulang tahun itu doa,<br>maka aku harap semesta selalu ramah sama kamu.<br><br>Sok atuh, senyum dulu 🤍"
];

function typeWriter(text, i = 0) {
  if (i < text.length) {
    textEl.innerHTML += text.charAt(i);
    setTimeout(() => typeWriter(text, i + 1), 40);
  }
}

btn.onclick = () => {
  textEl.innerHTML = "";

  if (step === 0) {
    music.play();
    typeWriter(messages[1]);
    btn.innerText = "Reply";
  }
  else if (step === 1) {
    typeWriter(messages[2]);
    btn.innerText = "Reply lagi";
  }
  else if (step === 2) {
    typeWriter(messages[3]);
    btn.innerText = "Reply lagi";
  }
  else {
    // EASTER EGG
    textEl.innerHTML = `
      <h2>🔒 Secret Page</h2>
      <p>
      Kalau kamu sampai sini…<br><br>
      berarti kamu beneran penting.<br><br>
      Terima kasih sudah ada.<br>
      Jangan berubah ya.<br><br>
      🎂🤍
      </p>
    `;
    btn.classList.add("hidden");
  }

  step++;
};
</script>

</body>
</html>
