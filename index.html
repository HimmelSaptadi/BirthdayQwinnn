<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>For You 🎂</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #2b1055, #000);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      text-align: center;
    }

    .card {
      max-width: 700px;
      padding: 40px;
      background: rgba(255,255,255,0.07);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 192, 203, 0.25);
      animation: fadeIn 1.5s ease;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.1em;
      line-height: 1.8;
    }

    button {
      margin-top: 30px;
      padding: 12px 28px;
      font-size: 1em;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #ff6ec7, #ff9a9e);
      color: #000;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 0 15px rgba(255,105,180,0.5);
    }

    button:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden {
      display: none;
    }

    .sparkle {
      font-size: 1.4em;
    }
  </style>
</head>
<body>

<audio id="bgm" autoplay loop>
  <source src="pasilyo.mp3" type="audio/mpeg">
</audio>

<div class="card" id="content">
  <h1 id="title"></h1>
  <p id="text"></p>
  <button id="replyBtn" class="hidden">Reply 💌</button>
</div>

<script>
  const title = document.getElementById("title");
  const text = document.getElementById("text");
  const btn = document.getElementById("replyBtn");
  const music = document.getElementById("bgm");

  music.volume = 0.25;

  let repeatCount = localStorage.getItem("repeat") || 0;

  const opening = "Hey... 👀";
  const message = `
  Happy Birthday to you 🎂✨  

  Hari ini officially milik kamu.
  Semoga semua hal baik, hal random,
  dan hal yang bikin kamu senyum,
  pelan-pelan datang ya 💖  

  You deserve happiness,  
  love, peace, dan hal-hal kecil  
  yang bikin kamu bilang  
  “kok bisa ya aku seberuntung ini?”  

  Dikiiit Sunda ya 😆  
  **sing salamet yuswa**,  
  sing sehat, sing bagja,  
  jeung sing tetep jadi kamu 🌷  

  From someone  
  who’s quietly grateful  
  that you exist 🤍
  `;

  let i = 0;
  function typeWriter(target, content, speed, callback) {
    if (i < content.length) {
      target.innerHTML += content.charAt(i);
      i++;
      setTimeout(() => typeWriter(target, content, speed, callback), speed);
    } else if (callback) {
      callback();
    }
  }

  typeWriter(title, opening, 80, () => {
    i = 0;
    setTimeout(() => {
      typeWriter(text, message, 25, () => {
        btn.classList.remove("hidden");
      });
    }, 800);
  });

  btn.onclick = () => {
    repeatCount++;
    localStorage.setItem("repeat", repeatCount);

    if (repeatCount >= 3) {
      title.innerHTML = "EH 😭";
      text.innerHTML = `
      Kamu ngeklik ini sampe ${repeatCount}x...  

      Easter egg unlocked 🎁✨  

      Fix kamu lucu.  
      Makasih udah mau baca ulang.  
      Sekarang senyum ya 😌💖
      `;
      btn.style.display = "none";
    } else {
      title.innerHTML = "Lah 😭";
      text.innerHTML = "Kok diulang lagi sih???";
    }
  };
</script>

</body>
</html>
