<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just a moment…</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400&display=swap');

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  transition: background 1.5s ease;
}

/* DARK PAGE */
body.dark {
  background: linear-gradient(135deg, #0f0f1a, #1a1a2e, #16213e);
}

/* PINK PAGE */
body.pink {
  background: linear-gradient(135deg, #ff9eb5, #ffc2d1, #ffe0e9);
  color: #4a2c35;
}

.container {
  max-width: 420px;
  padding: 30px;
  text-align: center;
  position: relative;
  z-index: 2;
}

button {
  margin-top: 25px;
  padding: 12px 28px;
  border-radius: 30px;
  border: none;
  font-size: 15px;
  cursor: pointer;
  background: linear-gradient(135deg, #ff8fa3, #ffb3c1);
  color: #1a1a2e;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.07);
}

.hidden { display: none; }

.heartbeat {
  display: inline-block;
  animation: beat 1.2s infinite;
}
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* DECORATIONS */
.decor {
  position: fixed;
  font-size: 30px;
  opacity: 0.8;
  animation: float 4s ease-in-out infinite alternate;
  z-index: 1;
}
@keyframes float {
  from { transform: translateY(0px); }
  to { transform: translateY(15px); }
}

.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: -10px;
  animation: fall linear forwards;
}
@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}
</style>
</head>

<body class="dark">

<div id="decorations"></div>

<div class="container">
  <div id="text"></div>
  <button id="btn">Klik ini pelan-pelan</button>
</div>

<audio id="music" src="pasilyo.mp3" loop></audio>

<script>
const body = document.body;
const textEl = document.getElementById("text");
const btn = document.getElementById("btn");
const music = document.getElementById("music");
const decorContainer = document.getElementById("decorations");

music.volume = 0.3;
let step = 0;
const namaDia = "Uwinnnnn"; // ganti nama

const messages = [
`Eh…<br><br>Tunggu sebentar ya.`,
`<b class="heartbeat">Selamat ulang tahun, ${namaDia} 🎉</b><br><br>
Hari ini bukan hari biasa.`,
`Masih di sini ya? 😌<br><br>
Aku senang kamu ada.`,
`Semoga kamu selalu menemukan jalan pulang.`,
];

function typeWriter(text, speed = 35) {
  textEl.innerHTML = "";
  let temp = document.createElement("div");
  temp.innerHTML = text;
  let nodes = Array.from(temp.childNodes);

  function typeNode() {
    if (nodes.length === 0) return;
    let node = nodes.shift();

    if (node.nodeType === 3) {
      let content = node.textContent;
      let i = 0;
      let interval = setInterval(() => {
        textEl.innerHTML += content.charAt(i);
        i++;
        if (i >= content.length) {
          clearInterval(interval);
          typeNode();
        }
      }, speed);
    } else {
      textEl.appendChild(node.cloneNode(true));
      typeNode();
    }
  }
  typeNode();
}

function clearDecor() {
  decorContainer.innerHTML = "";
}

function addDecor(symbols) {
  clearDecor();
  symbols.forEach(sym => {
    const el = document.createElement("div");
    el.className = "decor";
    el.innerText = sym;
    el.style.top = Math.random()*80 + "vh";
    el.style.left = Math.random()*90 + "vw";
    decorContainer.appendChild(el);
  });
}

function createConfetti() {
  for (let i = 0; i < 80; i++) {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    document.body.appendChild(confetti);
    confetti.style.left = Math.random()*100 + "vw";
    confetti.style.animationDuration = (Math.random()*3+2)+"s";
    confetti.style.backgroundColor =
      ["#ff8fa3","#ffffff","#ffc2d1"][Math.floor(Math.random()*3)];
    setTimeout(()=>confetti.remove(),5000);
  }
}

/* PAGE 1 DECOR */
addDecor(["❓"]);

typeWriter(messages[0]);

btn.onclick = () => {

  music.play().catch(()=>{});

  if (step === 0) {
    body.classList.remove("dark");
    body.classList.add("pink");
    addDecor(["💖","✨","🌸"]);
    typeWriter(messages[1]);
    btn.innerText = "Reply";
  }
  else if (step === 1) {
    addDecor(["⭐","🌟","💫"]);
    typeWriter(messages[2]);
    btn.innerText = "Reply lagi";
  }
  else if (step === 2) {
    addDecor(["🌷","💐","🌺"]);
    typeWriter(messages[3]);
    btn.innerText = "Reply lagi";
  }
  else {
    addDecor(["🎉","🎊","🥳"]);
    createConfetti();
    textEl.innerHTML = `
      <h2>🎉 Secret Page 🎉</h2>
      <p>
      Selamat ulang tahun, ${namaDia} 🤍<br><br>
      Aku bersyukur ada kamu.
      </p>
    `;
    btn.classList.add("hidden");
  }

  step++;
};
</script>

</body>
</html>
