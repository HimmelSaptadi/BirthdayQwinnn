<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    transition:1s;
    overflow:hidden;
}

/* Background */
.dark{
    background:linear-gradient(135deg,#000000,#1a1a1a);
    color:white;
}

.pink{
    background:linear-gradient(135deg,#ff9ecf,#ffcce6);
    color:#5a0033;
}

/* Container */
.container{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
    position:relative;
}

h1{
    max-width:600px;
    line-height:1.6;
}

button{
    margin-top:25px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:#ff4da6;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
    background:#ff1a8c;
}

/* Floating decor */
.decor{
    position:absolute;
    font-size:26px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

/* Fade */
.fade{
    animation:fade 1s ease;
}

@keyframes fade{
    from{opacity:0}
    to{opacity:1}
}

/* Heartbeat */
.heartbeat{
    animation:beat 1.2s infinite;
}

@keyframes beat{
    0%{transform:scale(1)}
    25%{transform:scale(1.2)}
    40%{transform:scale(1)}
    60%{transform:scale(1.2)}
    100%{transform:scale(1)}
}
</style>
</head>

<body class="dark">

<div class="container" id="container">
    <h1 id="text">Kira-kira ini apa ya???...</h1>
    <button id="btn" onclick="nextPage()">Klik di sini nih</button>
</div>

<audio id="music" loop>
    <source src="pasilyo.mp3" type="audio/mpeg">
</audio>

<script>
let step = 0;
const namaDia = "Uwinnnnn"; // GANTI

function clearDecor(){
    document.querySelectorAll(".decor").forEach(e => e.remove());
}

function addDecor(symbol, top, left, right, bottom){
    const decor = document.createElement("div");
    decor.className="decor";
    decor.innerHTML=symbol;
    if(top) decor.style.top=top;
    if(left) decor.style.left=left;
    if(right) decor.style.right=right;
    if(bottom) decor.style.bottom=bottom;
    document.getElementById("container").appendChild(decor);
}

function nextPage(){
    const text=document.getElementById("text");
    const btn=document.getElementById("btn");
    const body=document.body;

    clearDecor();

    text.classList.remove("fade");
    void text.offsetWidth;
    text.classList.add("fade");

    if(step===0){
        document.getElementById("music").play();
        body.classList.remove("dark");
        body.classList.add("pink");

        text.innerHTML=`Selamat ulang tahun, <span class="heartbeat">${namaDia}</span> 🎉<br><br>
        Hari ini bukan cuma tentang bertambahnya usia.<br>
        Hari ini tentang kamu — dan semua hal baik yang kamu bawa.`;

        btn.innerHTML="Reply →";

        // 🎀 Dekor Page 2
        addDecor("🎀","20px",null,"20px",null);
        addDecor("✨","60px","40px",null,null);
    }

    else if(step===1){
        text.innerHTML=`Aku cuma ingin bilang sesuatu…<br><br>
        Semoga di usia yang baru ini,<br>
        kamu menemukan lebih banyak alasan untuk tersenyum.`;

        // ✨ Dekor Page 3
        addDecor("✨","30px","30px",null,null);
        addDecor("💖","70px",null,"50px",null);
    }

    else if(step===2){
        text.innerHTML=`Kalau suatu hari semuanya terasa berat,<br><br>
        ingat ya — kamu sudah sejauh ini.<br>
        Dan itu bukan hal kecil.`;

        // 💌 Dekor Page 4
        addDecor("💌",null,null,"40px","40px");
        addDecor("🌸","80px","50px",null,null);
    }

    else if(step===3){
        text.innerHTML=`Kalau kamu sudah sampai di sini…<br><br>
        berarti kamu benar-benar membacanya.<br>
        Dan itu bikin aku senang.<br><br>
        Masih ada satu hal terakhir…`;

        // ❓ Dekor Suspense
        addDecor("❓","25px",null,"50px",null);
        addDecor("✨","100px","70px",null,null);
    }

    else if(step===4){
        text.innerHTML=`<span class="heartbeat">💖 FINAL PAGE 💖</span><br><br>
        Aku bersyukur bisa mengenal kamu.<br>
        Semoga tahun ini jadi tahun terbaik untukmu.<br><br>
        Terima kasih sudah jadi kamu.`;

        btn.innerHTML="End";

        // 🔥 SECRET DECOR
        addDecor("🎉","20px","20px",null,null);
        addDecor("💖","60px",null,"40px",null);
        addDecor("✨","120px","80px",null,null);
    }

    else{
        btn.style.display="none";
    }

    step++;
}
</script>

</body>
</html>
