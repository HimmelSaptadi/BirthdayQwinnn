<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just a moment…</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400&display=swap');

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
  color: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* 🌌 STARS BACKGROUND */
.stars {
  position: fixed;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  z-index: -1;
}

.stars::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.15;
  animation: moveStars 60s linear infinite;
}

@keyframes moveStars {
  from { transform: translateY(0); }
  to { transform: translateY(-200px); }
}

.container {
  max-width: 420px;
  padding: 30px;
  text-align: center;
  animation: fadeIn 1.2s ease;
}

h1, h2 {
  font-family: 'Playfair Display', serif;
  font-weight: 600;
}

button {
  margin-top: 25px;
  padding: 12px 28px;
  border-radius: 30px;
  border: none;
  font-size: 15px;
  cursor: pointer;
  background: linear-gradient(135deg, #ff8fa3, #ffb3c1);
  color: #1a1a2e;
  font-weight: 500;
  transition: 0.3s;
}

button:hover {
  opacity: 0.9;
  transform: scale(1.05);
}

.hidden {
  display: none;
}

/* ✨ FADE EFFECT */
.fade {
  animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 💓 HEARTBEAT */
.heartbeat {
  display: inline-block;
  animation: beat 1.2s infinite;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

/* 🎉 CONFETTI */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: -10px;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
  <div id="text"></div>
  <button id="btn">Klik ini pelan-pelan</button>
</div>

<audio id="music" src="pasillyo.mp3" loop></audio>

<script>
const textEl = document.getElementById("text");
const btn = document.getElementById("btn");
const music = document.getElementById("music");

music.volume = 0.25;

let step = 0;

const messages = [
`Eh…<br><br>
Bentar dulu.`,

`Oke…<br>
sekarang boleh mulai.<br><br>
Hari ini bukan hari biasa.<br><br>
Karena di hari ini,<br>
seseorang yang penting banget lahir ke dunia.<br><br>
<b class="heartbeat">Happy Birthday ✨</b><br><br>
Semoga hari ini kamu ngerasa disayang,<br>
diperhatiin,<br>
dan diinget.`,

`Eh…<br>
kok di-reply?<br><br>
Kamu penasaran ya 😌<br><br>
Gapapa,<br>
aku juga bakal ngulang<br>
kalau ini soal kamu.<br><br>
Jeung mun cape…<br>
istirahat heula, ulah maksa.`,

`Fix…<br>
kamu emang nggak bisa berhenti 😂<br><br>
Tapi jujur,<br>
aku seneng kamu masih di sini.<br><br>
If I could wish one thing for you—<br>
semoga kamu selalu nemu jalan pulang,<br>
even di hari yang berat.`
];

function typeWriter(text, i = 0) {
  if (i === 0) {
    textEl.innerHTML = "";
    textEl.classList.remove("fade");
  }

  if (i < text.length) {
    textEl.innerHTML += text.charAt(i);
    setTimeout(() => typeWriter(text, i + 1), 35);
  } else {
    textEl.classList.add("fade");
  }
}

function createConfetti() {
  for (let i = 0; i < 80; i++) {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    document.body.appendChild(confetti);

    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
    confetti.style.backgroundColor =
      ["#ff8fa3", "#ffd6e0", "#ffffff", "#ffb3c1"][Math.floor(Math.random() * 4)];

    setTimeout(() => confetti.remove(), 5000);
  }
}

typeWriter(messages[0]);

btn.onclick = () => {
  if (step === 0) {
    music.play();
    typeWriter(messages[1]);
    btn.innerText = "Reply";
  }
  else if (step === 1) {
    typeWriter(messages[2]);
    btn.innerText = "Reply lagi";
  }
  else if (step === 2) {
    typeWriter(messages[3]);
    btn.innerText = "Reply lagi";
  }
  else {
    createConfetti();
    textEl.innerHTML = `
      <h2>🔒 Secret Page</h2>
      <p>
      Kalau kamu sampai ke sini…<br><br>
      berarti kamu beneran baca semuanya.<br><br>
      Aku cuma mau bilang satu hal,<br>
      yang nggak aku tulis di mana-mana.<br><br>
      <b>Aku bersyukur ada kamu.</b><br><br>
      Selamat ulang tahun 🤍<br>
      Jangan lupa…<br>
      kamu nggak sendirian.
      </p>
    `;
    btn.classList.add("hidden");
  }
  step++;
};
</script>

</body>
</html>
